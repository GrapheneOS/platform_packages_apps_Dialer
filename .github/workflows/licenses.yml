name: Check licenses

on: [pull_request, push]

jobs:
  licenses:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Regenerate licenses
        run: ./gradlew :app:generateLicenses --no-daemon --rerun

      - name: Fail if the generated licenses are out of date
        run: |
          if ! git diff --exit-code -- java/com/android/dialer/about/res/raw; then
            echo "::error::third_party_licenses is out of date. Run './gradlew :app:generateLicenses' and commit the result."
            exit 1
          fi
