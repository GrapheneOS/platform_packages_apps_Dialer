config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    ignoreAnnotated:
      - Preview
      - PreviewLightDark
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    allowedFunctionsPerClass: 60
    allowedFunctionsPerFile: 15
    allowedFunctionsPerInterface: 50
    ignoreAnnotatedFunctions:
      - Preview
      - PreviewLightDark

coroutines:
  # A @Provides that returns a dispatcher is the qualifier module doing its job, not a hardcoded
  # one. Everywhere else the rule stays on, because a ViewModel reaching for Dispatchers.IO
  # directly instead of injecting it is exactly the defect it exists to catch.
  InjectDispatcher:
    ignoreAnnotated:
      - Provides

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  # @Binds requires an abstract class; an interface cannot hold one.
  AbstractClassCanBeInterface:
    ignoreAnnotated:
      - Module
  ForbiddenImport:
    active: true
    forbiddenImports:
      # Leftover of the deleted rootcomponentgenerator. Shares its simple name with
      # dagger.hilt.InstallIn, so an auto-import here silently does nothing.
      - value: 'com.android.dialer.inject.InstallIn'
        reason: 'Use dagger.hilt.InstallIn'
  MagicNumber:
    ignoreCompanionObjectPropertyDeclaration: true
    ignorePropertyDeclaration: true
    ignoreAnnotated:
      - Composable
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview
      - PreviewLightDark
